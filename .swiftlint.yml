excluded:
  - .build
  - DerivedData
  - "**/.build"

opt_in_rules:
  - force_unwrapping
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil

disabled_rules:
  - line_length
  - todo
  # App-style defaults: app code tends to have larger files, view functions,
  # and settings initializers than library code, so these fire on noise.
  - type_body_length
  - file_length
  - function_body_length
  - cyclomatic_complexity
  - function_parameter_count
  # The bundled swift-format (Swift 6.x) enforces the opposite of these
  # SwiftLint rules (opening brace on its own line for multi-line conditions,
  # closure parameters on their own line, and no trailing commas). CI runs
  # `swift format lint` first, so SwiftLint is aligned with the formatter.
  - opening_brace
  - closure_parameter_position
  - trailing_comma

analyzer_rules:
  - unused_import
  - unused_declaration
