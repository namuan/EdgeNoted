name: EdgeNoted
options:
  bundleIdPrefix: com.github.namuan
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  EdgeNoted:
    type: application
    platform: macOS
    sources:
      - path: EdgeNoted
    resources:
      - path: EdgeNoted/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.namuan.edgenoted
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: EdgeNoted/Resources/EdgeNoted.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: SupportingFiles/EdgeNoted.Info.plist
      properties:
        CFBundleDisplayName: EdgeNoted
        CFBundleShortVersionString: "1.6"
        CFBundleVersion: "16"
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        NSAppleEventsUsageDescription: EdgeNoted reads and writes your Apple Notes and Reminders so they stay in sync with the edge panel.

  EdgeNotedTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: EdgeNotedTests
    dependencies:
      - target: EdgeNoted
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

  EdgeNotedUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: EdgeNotedUITests
    dependencies:
      - target: EdgeNoted
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  EdgeNoted:
    build:
      targets:
        EdgeNoted: all
        EdgeNotedTests: [test]
        EdgeNotedUITests: [test]
    test:
      targets:
        - EdgeNotedTests
        - EdgeNotedUITests
    run:
      config: Debug
